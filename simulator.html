<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест на социальный рейтинг</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .option-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: #141414;
            border: 1px solid #2a2a2a;
            color: #e0e0e0;
            padding: 1rem 1.3rem;
            border-radius: 10px;
            margin-bottom: 0.8rem;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.25s ease;
        }
        .option-btn:hover {
            border-color: #00e5ff;
            background: #1a2426;
            color: #fff;
        }
        .score-display {
            font-size: 3.5rem;
            font-weight: 800;
            color: #00e5ff;
            text-shadow: 0 0 25px rgba(0, 229, 255, 0.5);
            margin: 1rem 0;
        }
    </style>
</head>
<body>

    <header id="navbar"></header>

    <div class="container">
        <h1 class="page-title">Симулятор <span class="glitch" data-text="рейтинга">рейтинга</span></h1>
        <p class="page-subtitle">Оценка вашей цифровой лояльности по протоколу эпизода «Нырок».</p>

        <div class="card visible" id="quiz-box">
            <span class="tag" id="q-counter">Вопрос 1 из 4</span>
            <h2 id="q-text">Загрузка протокола...</h2>
            <div id="options-container" style="margin-top: 1.5rem;"></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        const questions = [
            {
                text: "Бариста в кофейне сделал вам напиток с кривым рисунком на пенке, но вежливо улыбнулся. Ваша оценка?",
                options: [
                    { label: "5 звёзд и восторженный комментарий для поддержания рейтинга", delta: 0.4 },
                    { label: "4 звезды — нормально, но без восторга", delta: 0.0 },
                    { label: "1 звезда за испорченное настроение", delta: -0.9 }
                ]
            },
            {
                text: "Коллега с рейтингом 2.4 просит вас порекомендовать его на хорошую должность. Ваши действия?",
                options: [
                    { label: "Вежливо откажусь, чтобы не уронить свой балл рядом с ним", delta: 0.3 },
                    { label: "Соглашусь помочь, если он действительно хороший специалист", delta: -0.7 },
                    { label: "Сделаю вид, что не заметил сообщение", delta: 0.1 }
                ]
            },
            {
                text: "Вы заметили в сети непопулярное, но честное мнение, которое критикует тренды. Как отреагируете?",
                options: [
                    { label: "Публично осужу автора ради одобрения большинства", delta: 0.4 },
                    { label: "Пройду мимо без оценки", delta: 0.0 },
                    { label: "Поддержу лайком и репостом", delta: -0.8 }
                ]
            },
            {
                text: "Ваш рейс задержали, и вы опаздываете на важное мероприятие. Что видят окружающие?",
                options: [
                    { label: "Безупречную улыбку и спокойствие на лице", delta: 0.4 },
                    { label: "Лёгкое раздражение, но без скандала", delta: -0.4 },
                    { label: "Громкий спор с сотрудниками аэропорта", delta: -1.3 }
                ]
            }
        ];

        let currentStep = 0;
        let rating = 3.5;

        function renderQuestion() {
            const q = questions[currentStep];
            document.getElementById("q-counter").textContent = `Вопрос ${currentStep + 1} из ${questions.length}`;
            document.getElementById("q-text").textContent = q.text;
            
            const container = document.getElementById("options-container");
            container.innerHTML = "";

            q.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.textContent = opt.label;
                btn.onclick = () => {
                    rating = Math.min(5.0, Math.max(0.1, rating + opt.delta));
                    currentStep++;
                    if (currentStep < questions.length) {
                        renderQuestion();
                    } else {
                        showResult();
                    }
                };
                container.appendChild(btn);
            });
        }

        function showResult() {
            const finalScore = rating.toFixed(1);
            let status = "";
            let desc = "";

            if (rating >= 4.2) {
                status = "Элитный гражданин (Доступ открыт)";
                desc = "Вы идеально вписались в систему. Вам доступны скидки на жильё, приоритет в очередях и одобрение общества ценой искренности.";
            } else if (rating >= 2.8) {
                status = "Средний уровень (Наблюдение)";
                desc = "Вы стараетесь соблюдать правила, но иногда позволяете себе живые эмоции. Будьте осторожны: одно неверное слово снизит ваш статус.";
            } else {
                status = "Критически низкий рейтинг (Ограничение прав)";
                desc = "Система распознала в вас склонность к искренности и бунту. Доступ к премиум-сервисам заблокирован.";
            }

            document.getElementById("quiz-box").innerHTML = `
                <span class="tag">Результат сканирования</span>
                <h2>${status}</h2>
                <div class="score-display">${finalScore} ★</div>
                <p>${desc}</p>
                <button class="btn" onclick="location.reload()">Пройти заново</button>
            `;
        }

        renderQuestion();
    </script>
</body>
</html>

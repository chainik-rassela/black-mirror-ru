<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест на социальный рейтинг</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .progress-bar-wrap {
            width: 100%;
            height: 6px;
            background: #181818;
            border-radius: 4px;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
            transition: width 0.35s ease;
        }
        .option-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: #141414;
            border: 1px solid #2a2a2a;
            color: #e0e0e0;
            padding: 1rem 1.3rem;
            border-radius: 10px;
            margin-bottom: 0.8rem;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.25s ease;
            line-height: 1.4;
        }
        .option-btn:hover {
            border-color: var(--accent);
            background: #1a2426;
            color: #fff;
        }
        .score-display {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--accent);
            text-shadow: 0 0 25px var(--accent-glow);
            margin: 1rem 0;
            font-family: "Courier New", monospace;
        }
        @media (max-width: 600px) {
            .option-btn {
                padding: 0.9rem 1rem;
                font-size: 0.92rem;
            }
        }
    </style>
</head>
<body>

    <header id="navbar"></header>

    <div class="container">
        <h1 class="page-title">Симулятор <span class="glitch" data-text="рейтинга">рейтинга</span></h1>
        <p class="page-subtitle">Оценка вашей цифровой лояльности по протоколу эпизода «Нырок» (8 ситуаций).</p>

        <div class="card visible" id="quiz-box">
            <div class="progress-bar-wrap">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
            <span class="tag" id="q-counter">Вопрос 1 из 8</span>
            <h2 id="q-text">Загрузка протокола...</h2>
            <div id="options-container" style="margin-top: 1.5rem;"></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        const questions = [
            {
                text: "Бариста в кофейне сделал вам напиток с кривым рисунком на пенке, но вежливо улыбнулся. Ваша оценка?",
                options: [
                    { label: "5 звёзд и восторженный комментарий для поддержания рейтинга", delta: 0.3 },
                    { label: "4 звезды — нормально, но без восторга", delta: 0.0 },
                    { label: "1 звезда за испорченное настроение", delta: -0.8 }
                ]
            },
            {
                text: "Коллега с рейтингом 2.4 просит вас порекомендовать его на хорошую должность. Ваши действия?",
                options: [
                    { label: "Вежливо откажусь, чтобы не уронить свой балл рядом с ним", delta: 0.25 },
                    { label: "Соглашусь помочь, если он действительно хороший специалист", delta: -0.6 },
                    { label: "Сделаю вид, что не заметил сообщение", delta: 0.05 }
                ]
            },
            {
                text: "Вы заметили в сети непопулярное, но честное мнение, которое критикует тренды. Как отреагируете?",
                options: [
                    { label: "Публично осужу автора ради одобрения большинства", delta: 0.3 },
                    { label: "Пройду мимо без оценки", delta: 0.0 },
                    { label: "Поддержу лайком и репостом", delta: -0.7 }
                ]
            },
            {
                text: "Ваш рейс задержали, и вы опаздываете на важное мероприятие. Что видят окружающие?",
                options: [
                    { label: "Безупречную улыбку и спокойствие на лице", delta: 0.3 },
                    { label: "Лёгкое раздражение, но без скандала", delta: -0.3 },
                    { label: "Громкий спор с сотрудниками аэропорта", delta: -1.1 }
                ]
            },
            {
                text: "Вам предлагают бесплатно установить имплант памяти «Зерно» для записи всей жизни.",
                options: [
                    { label: "Соглашусь первым и опубликую восторженный обзор", delta: 0.25 },
                    { label: "Отложу решение под благовидным предлогом", delta: -0.15 },
                    { label: "Выступлю за право на приватность и забвение", delta: -0.8 }
                ]
            },
            {
                text: "Система предлагает пропустить навязчивую рекламу за списание части виртуальных заслуг.",
                options: [
                    { label: "Оплачу пропуск, не прерывая просмотр", delta: 0.2 },
                    { label: "Покорно досмотрю ролик до конца", delta: 0.05 },
                    { label: "Закрою глаза и отвернусь от датчиков взгляда", delta: -0.75 }
                ]
            },
            {
                text: "Алгоритм умного дома временно ограничил ваш аккаунт из-за подозрительной активности.",
                options: [
                    { label: "Пройду биометрическую проверку и подтвержу лояльность", delta: 0.25 },
                    { label: "Подожду разблокировки молча", delta: -0.1 },
                    { label: "Попытаюсь взломать локальный шлюз через терминал", delta: -1.1 }
                ]
            },
            {
                text: "Вас пригласили выступить на главной сцене перед миллионами зрителей.",
                options: [
                    { label: "Поблагодарю спонсоров и исполню позитивный номер", delta: 0.3 },
                    { label: "Скажу нейтральную речь о пользе технологий", delta: 0.0 },
                    { label: "Сорву эфир речью о том, что мы продали свободу за лайки", delta: -1.2 }
                ]
            }
        ];

        let currentStep = 0;
        let rating = 3.5;

        function renderQuestion() {
            const q = questions[currentStep];
            const progress = (currentStep / questions.length) * 100;
            document.getElementById("progress-fill").style.width = progress + "%";
            document.getElementById("q-counter").textContent = `Вопрос ${currentStep + 1} из ${questions.length}`;
            document.getElementById("q-text").textContent = q.text;
            
            const container = document.getElementById("options-container");
            container.innerHTML = "";

            q.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.textContent = opt.label;
                btn.onclick = () => {
                    if (window.bmSound) window.bmSound.playType();
                    rating = Math.min(5.0, Math.max(0.1, rating + opt.delta));
                    currentStep++;
                    if (currentStep < questions.length) {
                        renderQuestion();
                    } else {
                        showResult();
                    }
                };
                container.appendChild(btn);
            });
        }

        function showResult() {
            const finalScore = parseFloat(rating.toFixed(1));
            if (window.updateGlobalRating) {
                window.updateGlobalRating(finalScore);
            }

            let status = "";
            let desc = "";

            if (finalScore >= 4.2) {
                status = "Элитный гражданин (Доступ открыт)";
                desc = "Вы идеально вписались в систему. Вам доступны скидки на жильё, приоритет в очередях и полный доступ к терминалу.";
            } else if (finalScore >= 2.5) {
                status = "Средний уровень (Наблюдение)";
                desc = "Вы стараетесь соблюдать правила, но иногда позволяете себе живые эмоции. Будьте осторожны: одно неверное слово снизит ваш статус.";
            } else {
                status = "Статус изгоя (Доступ заблокирован)";
                desc = "Ваш рейтинг упал ниже 2.5. Весь сайт переведён в красный режим надзора, а секретный терминал заблокирован до пересдачи теста.";
                if (window.bmSound) window.bmSound.playError();
            }

            document.getElementById("quiz-box").innerHTML = `
                <div class="progress-bar-wrap">
                    <div class="progress-bar-fill" style="width: 100%;"></div>
                </div>
                <span class="tag">Результат сканирования</span>
                <h2>${status}</h2>
                <div class="score-display">${finalScore.toFixed(1)} ★</div>
                <p>${desc}</p>
                <button class="btn" onclick="location.reload()">Пройти заново</button>
            `;
        }

        renderQuestion();
    </script>
</body>
</html>
